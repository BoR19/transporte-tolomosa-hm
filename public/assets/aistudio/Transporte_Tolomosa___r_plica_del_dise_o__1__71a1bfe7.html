/* ---------- estado, validaciones y utilidades ---------- */
const RAMALES = ["Tolomosa", "Churquis", "Pampa Redonda"];
const SEED = [

];
const CFG0 = { coop: "Transporte Tolomosa", notif: true };
/* Guarda en sessionStorage: sobrevive a recargar la página, se borra al cerrar la pestaña */
function useStored(key, init) {
  const [v, setV] = useState(() => { try { const r = sessionStorage.getItem(key); return r ? JSON.parse(r) : init; } catch { return init; } });
  useEffect(() => { try { sessionStorage.setItem(key, JSON.stringify(v)); } catch { /* sin almacenamiento */ } }, [key, v]);
  return [v, setV];
}
const vNombre = (s) => (!s.trim() ? "Escribe el nombre" : s.trim().length < 3 ? "Mínimo 3 letras" : /\d/.test(s) ? "No uses números" : "");
const vMicro = (v, ds, id) => (v === "" ? "" : !/^\d+$/.test(String(v)) ? "Solo números" : +v < 1 || +v > 36 ? "Debe estar entre 1 y 36" : ds.some((d) => d.micro === +v && d.id !== id) ? `El micro N° ${v} ya está asignado` : "");
const vTel = (s) => (/^[67]\d{7}$/.test(s) ? "" : "Ingresa 8 dígitos que empiecen con 6 o 7");
const hm = (t) => new Date(t).toLocaleTimeString("es-BO", { hour: "2-digit", minute: "2-digit" });
const mins = (a, b) => Math.max(1, Math.round((b - a) / 60000));
const T0 = Date.now();
const CODE = "1234"; /* código de prueba para iniciar sesión */
const mmss = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const useNow = () => { const [n, setN] = useState(Date.now()); useEffect(() => { const id = setInterval(() => setN(Date.now()), 1000); return () => clearInterval(id); }, []); return n; };
function Fit({ children }) {
  const [k, setK] = useState(1);
  useEffect(() => { const f = () => setK(Math.min(1, (window.innerWidth - 16) / 372, (window.innerHeight - 70) / 750)); f(); window.addEventListener("resize", f); return () => window.removeEventListener("resize", f); }, []);
  return <div style={{ width: 372 * k, height: 750 * k }}><div style={{ width: 372, height: 750, transform: `scale(${k})`, transformOrigin: "top left" }}>{children}</div></div>;
}
const dirTxt = (d) => (d === "campesino" ? "Hacia el Campesino" : "Hacia los Ramales");

      </div>

};

/* ---------- pantallas ---------- */
const Pasajero = ({ drivers, trip, now, profile, setProfile, auth, setAuth, view, go, toast, say }) => {
  const [dest, setDest] = useState("Campesino");
  const [q, setQ] = useState("Campesino");
  const [busy, setBusy] = useState(false);
  const [modal, setModal] = useState(false);
  /* Solo choferes habilitados (Disponible). Si tienen viaje activo se usa su ramal y su sentido. */
  const compute = (d) => drivers.filter((x) => x.on && x.micro).map((x) => { const t = trip && trip.micro === x.micro ? trip : null; return { ...x, t, ramal: t ? t.ramal : x.ramal }; })
    .filter((x) => (d === "Campesino" ? !x.t || x.t.dir === "campesino" : x.ramal === RAMALES.indexOf(d.replace("Ramal ", "")) && (!x.t || x.t.dir === "ramales")))
    .map((x) => { const base = 150 + ((x.micro * 37) % 400); const el = (now - (x.t ? x.t.start : T0)) / 1000; return { ...x, m: Math.round((60 + ((((base - 60 - el * 6) % 480) + 480) % 480)) / 10) * 10, a: x.t ? (x.t.dir === "campesino" ? 3.3 : 6.0) : [3.5, 5.6, 2.3][x.micro % 3] }; })
    .sort((a, b) => a.m - b.m).slice(0, 6);
  const list = compute(q);
  const buscar = () => {
    if (busy) return;
    setBusy(true);
    setTimeout(() => { setQ(dest); setBusy(false); const n = compute(dest).length; say("pas", n ? `${n} micro${n > 1 ? "s" : ""} disponible${n > 1 ? "s" : ""} hacia ${dest}` : `No hay micros disponibles hacia ${dest}`, n ? "ok" : "err"); }, 600);
  };
  const locate = () => {
    if (!navigator.geolocation) return say("pas", "Este dispositivo no tiene GPS", "err");

          <h2 className="mb-2 flex items-center gap-2 text-[18px] font-bold text-[#11203f]"><span className="text-[#16a34a]">{Ic.check("h-7 w-7")}</span>Micros más cercanos<span className="ml-auto text-[14px] font-semibold text-[#5f6f8a]">{list.length}</span></h2>

};

const ProfileModal = ({ profile, onSave, onClose, auth, setAuth, go, say }) => {
  const [f, setF] = useState(profile);
  const [t, setT] = useState({});
  const [ask, setAsk] = useState(null);
  const [code, setCode] = useState("");
  const [ce, setCe] = useState("");
  const err = { name: vNombre(f.name), phone: vTel(f.phone) };
  const save = () => { setT({ name: 1, phone: 1 }); if (!err.name && !err.phone) onSave({ name: f.name.trim(), phone: f.phone }); };
  const pick = (k) => { if (auth[k]) { go(k); onClose(); say(k, `Vista de ${k === "chof" ? "Chofer" : "Administrador"}`); } else { setAsk(k); setCode(""); setCe(""); } };
  const enter = () => {
    if (!/^\d{4}$/.test(code)) return setCe("Ingresa los 4 dígitos");
    if (code !== CODE) return setCe("Código incorrecto");
    setAuth({ ...auth, [ask]: true }); go(ask); onClose(); say(ask, "Sesión iniciada");
  };
  return (
    <Modal title="Mi cuenta" onClose={onClose}>
      <Input autoFocus label="Nombre" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} onBlur={() => setT({ ...t, name: 1 })} error={t.name && err.name} />
      <Input label="Teléfono" inputMode="numeric" maxLength={8} value={f.phone} onChange={(e) => setF({ ...f, phone: e.target.value.replace(/\D/g, "") })} onBlur={() => setT({ ...t, phone: 1 })} error={t.phone && err.phone} />
      <Btn className="w-full" onClick={save}>Guardar perfil</Btn>
      <div className="mt-4 border-t border-[#e1e8f3] pt-3">
        <h3 className="mb-2 text-[16px] font-bold text-[#11203f]">Iniciar sesión / cambiar de vista</h3>
        <div className="grid grid-cols-2 gap-2"><Btn tone="ghost" onClick={() => pick("chof")}>Chofer{auth.chof ? " ✓" : ""}</Btn><Btn tone="ghost" onClick={() => pick("adm")}>Administrador{auth.adm ? " ✓" : ""}</Btn></div>
        {ask && <div className="mt-3"><Input label={`Código de acceso de ${ask === "chof" ? "Chofer" : "Administrador"} (prueba: ${CODE})`} inputMode="numeric" maxLength={4} value={code} onChange={(e) => { setCode(e.target.value.replace(/\D/g, "")); setCe(""); }} error={ce} /><div className="grid grid-cols-2 gap-2"><Btn tone="ghost" onClick={() => setAsk(null)}>Cancelar</Btn><Btn onClick={enter}>Entrar</Btn></div></div>}
      </div>
    </Modal>
  );
};

const Chofer = ({ drivers, meId, trip, now, setTrip, setJornadas, onLogout, toast, say }) => {
  const me = drivers.find((d) => d.id === meId) || drivers[0];
  const [ramal, setRamal] = useState(0);
  const [dir, setDir] = useState("campesino");
  const [ask, setAsk] = useState(null);
  const r = trip ? trip.ramal : ramal;
  const d = trip ? trip.dir : dir;
  const start = () => {
    if (!me) return say("chof", "No hay choferes registrados", "err");
    if (!me.on) return say("chof", `${me.name} figura como No disponible. Pide al administrador que te habilite`, "err");
    if (!me.micro) return say("chof", "Aún no tienes un micro asignado", "err");
    setAsk("start");
  };
  const confirmStart = () => { setTrip({ name: me.name, micro: me.micro, ramal, dir, start: Date.now() }); setAsk(null); say("chof", `Viaje iniciado · Micro N° ${me.micro}`); };
  const confirmEnd = () => { const end = Date.now(); setJornadas((j) => [{ k: end, name: trip.name, micro: trip.micro, ramal: trip.ramal, dir: trip.dir, start: trip.start, end }, ...j]); setTrip(null); setAsk(null); say("chof", "Viaje terminado y registrado"); };
  const logout = () => (trip ? say("chof", "Termina el viaje antes de cerrar sesión", "err") : onLogout());
  const seg = (k) => `flex h-[62px] items-center justify-center gap-2 rounded-xl px-2 text-left text-[16px] font-bold leading-tight disabled:cursor-not-allowed ${d === k ? "bg-[#0b4bbf] text-white" : "border border-[#dfe4ec] bg-[#e8ebf0] text-[#11203f]"} ${trip && d !== k ? "opacity-60" : ""}`;
  return (
    <Phone toast={toast} overlay={
      ask === "start" && me ? <Confirm title="¿Comenzar viaje?" text={`Micro N° ${me.micro} · Ramal ${RAMALES[ramal]} · ${dirTxt(dir)}. Los pasajeros verán tu micro como en servicio.`} ok="Comenzar" tone="green" onOk={confirmStart} onClose={() => setAsk(null)} />
      : ask === "end" && trip ? <Confirm title="¿Terminar viaje?" text={`Llevas ${mins(trip.start, now)} min en ruta. El viaje quedará registrado en las jornadas.`} ok="Terminar" tone="red" onOk={confirmEnd} onClose={() => setAsk(null)} /> : null}>
      <div className="flex h-full flex-col bg-[#0b4bbf]">
        <Header icon={Ic.wheel("h-14 w-14")} title="Chofer" subtitle="Transporte Tolomosa" big action={<button type="button" aria-label="Cerrar sesión" onClick={logout} className="text-white">{Ic.logout("h-9 w-9")}</button>} />
        <Hero />
        <section className="-mt-3 flex flex-1 flex-col rounded-t-[26px] bg-white px-4 pt-4">
          <h2 className="flex items-center justify-center gap-2 text-[27px] font-extrabold text-[#11203f]"><span className="text-[#0b4bbf]">{Ic.road("h-10 w-10")}</span>{trip ? "Viaje en curso" : "Iniciar Viaje"}</h2>
          <span className="mb-1.5 mt-3 block text-[17px] font-bold text-[#11203f]">Ramal</span>
          <Field icon={Ic.pin("h-6 w-6 text-[#0b4bbf]")} tint="bg-[#e4edfb]" value={`Ramal ${RAMALES[r]}`} right={Ic.chevron("h-6 w-6 text-[#11203f]")}>
            <Pick label="Ramal" value={r} disabled={!!trip} onChange={(e) => setRamal(+e.target.value)}>{RAMALES.map((n, i) => <option key={n} value={i}>Ramal {n}</option>)}</Pick>
          </Field>
          <span className="mb-1.5 mt-3 block text-[17px] font-bold text-[#11203f]">Dirección</span>
          <div className="grid grid-cols-2 gap-1.5">
            <button type="button" aria-pressed={d === "campesino"} disabled={!!trip} onClick={() => setDir("campesino")} className={seg("campesino")}>{Ic.up("h-7 w-7 shrink-0")}<span>Hacia el<br />Campesino</span></button>
            <button type="button" aria-pressed={d === "ramales"} disabled={!!trip} onClick={() => setDir("ramales")} className={seg("ramales")}>{Ic.down("h-7 w-7 shrink-0")}<span>Hacia los<br />Ramales</span></button>
          </div>
          {trip ? (
            <button type="button" onClick={() => setAsk("end")} className="mt-4 flex h-[62px] w-full items-center justify-center gap-2 rounded-2xl bg-[#c0332b] text-[24px] font-extrabold text-white shadow-[0_5px_12px_rgba(192,51,43,.35)]"><span className="h-5 w-5 rounded-[4px] bg-white" />Terminar Viaje</button>
          ) : (
            <button type="button" onClick={start} className="mt-4 flex h-[62px] w-full items-center justify-center gap-2 rounded-2xl bg-[#16a34a] text-[24px] font-extrabold text-white shadow-[0_5px_12px_rgba(22,163,74,.35)]">{Ic.play("h-9 w-9")}Comenzar Viaje</button>
          )}
          <div className="mt-3.5 flex items-center gap-3 rounded-[14px] border border-[#c3d6f3] bg-[#dde9fb] px-3.5 py-3">
            <span className="text-[#1b6fe8]">{Ic.check("h-9 w-9")}</span><p className="text-[16px] font-semibold leading-tight text-[#11203f]">{trip ? `Micro N° ${trip.micro} en servicio · activo ${mmss(now - trip.start)}` : "Tu viaje quedará registrado para el control del servicio."}</p>
          </div>
          <Ridge className="mx-auto mt-auto h-14 w-64 pb-2" />
        </section>
      </div>
    </Phone>
  );
};

const DriverForm = ({ init, drivers, trip, onSave, onDelete, onCancel }) => {
  const [f, setF] = useState({ name: init?.name ?? "", micro: init?.micro ?? "", ramal: init?.ramal ?? 0 });
  const [t, setT] = useState({});
  const [del, setDel] = useState(false);
  const err = { name: vNombre(f.name), micro: vMicro(String(f.micro), drivers, init?.id) };
  const save = () => { setT({ name: 1, micro: 1 }); if (err.name || err.micro) return; onSave({ name: f.name.trim().replace(/\s+/g, " "), micro: String(f.micro) === "" ? null : +f.micro, ramal: +f.ramal }); };
  return (
    <>
      <Input autoFocus label="Nombre completo" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} onBlur={() => setT({ ...t, name: 1 })} error={t.name && err.name} />
      <Input label="Micro N° (opcional, 1 a 36)" inputMode="numeric" maxLength={2} value={f.micro} onChange={(e) => setF({ ...f, micro: e.target.value.replace(/\D/g, "") })} onBlur={() => setT({ ...t, micro: 1 })} error={t.micro && err.micro} />
      <label className="mb-4 block"><span className="text-[14px] font-semibold text-[#5f6f8a]">Ramal habitual</span>
        <select value={f.ramal} onChange={(e) => setF({ ...f, ramal: e.target.value })} className="mt-1 h-12 w-full rounded-[12px] border border-[#d3e0f4] bg-white px-3 text-[17px] font-semibold text-[#11203f]">{RAMALES.map((n, i) => <option key={n} value={i}>Ramal {n}</option>)}</select>
      </label>
      <div className="grid grid-cols-2 gap-2"><Btn tone="ghost" onClick={onCancel}>Cancelar</Btn><Btn onClick={save}>{init ? "Guardar cambios" : "Agregar"}</Btn></div>
      {init && (del
        ? <div className="mt-3 rounded-[14px] bg-[#fdeceb] p-3"><p className="mb-2 text-[14px] font-semibold text-[#c0332b]">¿Eliminar a {init.name}? No se puede deshacer.</p><Btn tone="red" className="w-full" onClick={() => onDelete(init)}>Sí, eliminar</Btn></div>
        : <button type="button" onClick={() => setDel(true)} className="mt-3 w-full text-[15px] font-bold text-[#c0332b]">Eliminar chofer</button>)}
    </>
  );
};

const Admin = ({ drivers, setDrivers, trip, jornadas, setJornadas, cfg, setCfg, resetAll, onLogout, toast, say }) => {
  const [tab, setTab] = useState("inicio");
  const [modal, setModal] = useState(null);
  const [draft, setDraft] = useState(cfg.coop);
  const [tc, setTc] = useState(false);
  const close = () => setModal(null);
  const tiles = [["people", "Choferes", "Gestionar personal", "inicio"], ["bus", "Vehículos", "Control de micros", "vehiculos"], ["bars", "Estadísticas", "Ver reportes", "reportes"], ["cal", "Jornadas", "Historial de viajes", "jornadas"]];
  const toggle = (d) => {
    if (!d.on && !d.micro) return say("adm", `Asigna un micro a ${d.name} antes de habilitarlo`, "err");
    if (d.on && trip && trip.micro === d.micro) return say("adm", `${d.name} tiene un viaje en curso`, "err");
    setDrivers((ds) => ds.map((x) => (x.id === d.id ? { ...x, on: !x.on } : x)));
    say("adm", `${d.name} ahora está ${d.on ? "No disponible" : "Disponible"}`);
  };
  const saveDriver = (init) => (v) => {
    if (init) { setDrivers((ds) => ds.map((x) => (x.id === init.id ? { ...x, ...v, on: v.micro ? x.on : false } : x))); say("adm", "Cambios guardados"); }
    else { setDrivers((ds) => [...ds, { id: Math.max(0, ...ds.map((x) => x.id)) + 1, ...v, on: v.micro != null, cap: "#1f5fd0" }]); say("adm", `Chofer agregado: ${v.name}${v.micro != null ? " · Disponible" : ""}`); }
    close();
  };
  const removeDriver = (d) => { if (trip && trip.micro === d.micro) return say("adm", "No puedes eliminar a un chofer con viaje en curso", "err"); setDrivers((ds) => ds.filter((x) => x.id !== d.id)); close(); say("adm", `${d.name} eliminado`); };
  const saveCfg = () => { setTc(true); if (draft.trim().length < 3) return; setCfg({ ...cfg, coop: draft.trim() }); say("adm", "Cambios guardados"); };
  const nav = (k, label, icon, tabs) => <button type="button" aria-current={tabs.includes(tab) ? "page" : undefined} onClick={() => setTab(k)} className={`flex flex-col items-center ${tabs.includes(tab) ? "text-[#0b4bbf]" : ""}`}>{icon("h-7 w-7")}{label}</button>;
  const back = (title) => <div className="flex shrink-0 items-center gap-2"><button type="button" aria-label="Volver al inicio" onClick={() => setTab("inicio")} className="grid h-9 w-9 place-items-center rounded-full bg-white text-[#0b4bbf] [&>svg]:rotate-90">{Ic.chevron("h-6 w-6")}</button><h2 className="text-[20px] font-extrabold text-[#11203f]">{title}</h2></div>;
  const card = "rounded-[18px] border border-[#e1e8f3] bg-white p-3";
  const total = jornadas.reduce((s, j) => s + mins(j.start, j.end), 0);
  const stats = [[`${drivers.filter((x) => x.on).length}/${drivers.length}`, "Choferes disponibles"], [String(jornadas.length), "Viajes realizados"], [`${total} min`, "Tiempo en ruta"], [trip ? "1" : "0", "Micros en ruta ahora"]];
  const modalEl = !modal ? null
    : modal.t === "driver" ? <Modal title={modal.d ? "Editar chofer" : "Agregar chofer"} onClose={close}><DriverForm init={modal.d} drivers={drivers} trip={trip} onSave={saveDriver(modal.d)} onDelete={removeDriver} onCancel={close} /></Modal>
    : modal.t === "logout" ? <Confirm title="¿Cerrar sesión?" text="Tendrás que ingresar de nuevo para administrar." ok="Cerrar sesión" onOk={() => { close(); setTab("inicio"); onLogout(); }} onClose={close} />
    : modal.t === "clear" ? <Confirm title="¿Borrar historial?" text="Se eliminarán todas las jornadas registradas." ok="Borrar" tone="red" onOk={() => { setJornadas([]); close(); say("adm", "Historial borrado"); }} onClose={close} />
    : <Confirm title="¿Restablecer datos?" text="Los choferes, jornadas y ajustes vuelven a los valores iniciales." ok="Restablecer" tone="red" onOk={() => { resetAll(); setDraft(CFG0.coop); close(); say("adm", "Datos restablecidos"); }} onClose={close} />;
  return (
    <Phone toast={toast} lift={84} overlay={modalEl}>
      <div className="flex h-full flex-col">
        <Header tone="bg-[#5b3db0]" icon={Ic.gear("h-14 w-14")} title="Administrador" subtitle={cfg.coop} action={<button type="button" aria-label="Cerrar sesión" onClick={() => setModal({ t: "logout" })} className="text-white">{Ic.logout("h-9 w-9")}</button>} />
        <div className={`-mt-1 flex min-h-0 flex-1 flex-col gap-2.5 rounded-t-[22px] bg-[#eef3fc] px-3 pb-2.5 pt-3 ${tab === "inicio" ? "" : "overflow-y-auto"}`}>
          {tab === "inicio" && (<>
            <div className="grid shrink-0 grid-cols-2 gap-2.5">
              {tiles.map(([k, t, s, go]) => (
                <button type="button" key={t} onClick={() => setTab(go)} className="rounded-[18px] border border-[#e1e8f3] bg-white px-2 py-2 text-center">
                  <span className="mx-auto block w-fit text-[#0b4bbf]">{Ic[k]("h-9 w-9 [--win:#fff]")}</span>
                  <div className="mt-1 text-[18px] font-bold leading-tight text-[#11203f]">{t}</div><div className="text-[13.5px] leading-tight text-[#5f6f8a]">{s}</div>
                </button>
              ))}
            </div>
            <div className="flex min-h-0 flex-1 flex-col rounded-[18px] border border-[#e1e8f3] bg-white px-3 pb-3 pt-3">
              <h2 className="mb-1 flex items-center gap-2 text-[19px] font-bold text-[#11203f]"><span className="text-[#0b4bbf]">{Ic.people("h-8 w-8")}</span>Choferes Registrados</h2>
              <ul className="min-h-0 flex-1 overflow-y-auto">
                {drivers.length === 0 && <li className="py-4 text-center text-[15px] text-[#5f6f8a]">Aún no hay choferes. Agrega el primero.</li>}
                {drivers.map((d) => (
                  <li key={d.id} className="flex items-center gap-2.5 border-t border-[#edf1f7] py-1 first:border-0">
                    <button type="button" onClick={() => setModal({ t: "driver", d })} aria-label={`Editar a ${d.name}`} className="flex flex-1 items-center gap-2.5 text-left">
                      <Avatar cap={d.cap} />
                      <span className="flex-1 leading-tight"><span className="block text-[17px] font-bold text-[#11203f]">{d.name}</span><span className="block text-[14px] text-[#5f6f8a]">{d.micro ? `Micro N° ${d.micro}` : "Reemplazo"}</span></span>
                    </button>
                    <span className={`rounded-full px-3 py-[3px] text-[13px] font-bold ${d.on ? "bg-[#22a447] text-white" : "bg-[#e3e7ee] text-[#7a8699]"}`}>{d.on ? "Disponible" : "No disponible"}</span>
                    <Toggle on={d.on} label={`Disponibilidad de ${d.name}`} onClick={() => toggle(d)} />

                ))}

              <button type="button" onClick={() => setModal({ t: "driver" })} className="mt-2 flex h-11 w-full shrink-0 items-center justify-center gap-2 rounded-xl bg-[#0b4bbf] text-[17px] font-bold text-white">{Ic.plus("h-6 w-6")}Agregar Chofer</button>
            </div>
          </>)}
          {tab === "vehiculos" && (<>{back("Vehículos")}
            <div className={card}>{drivers.filter((x) => x.micro).sort((a, b) => a.micro - b.micro).map((d) => (
              <div key={d.id} className="flex items-center gap-3 border-t border-[#edf1f7] py-2 first:border-0">
                <span className="text-[#0b4bbf]">{Ic.bus("h-9 w-9 [--win:#fff]")}</span>
                <span className="flex-1 leading-tight"><span className="block text-[17px] font-bold">Micro N° {d.micro}</span><span className="text-[14px] text-[#5f6f8a]">{d.name} · Ramal {RAMALES[d.ramal]}</span></span>
                <Chip on={!!trip && trip.micro === d.micro}>{trip && trip.micro === d.micro ? "En ruta" : d.on ? "Libre" : "Parado"}</Chip>
              </div>))}
              <p className="pt-2 text-[13.5px] text-[#5f6f8a]">{drivers.filter((x) => x.micro).length} de 36 micros con chofer asignado.</p></div></>)}
          {tab === "reportes" && (<>{back("Reportes")}
            <div className="grid grid-cols-2 gap-2.5">{stats.map(([n, l]) => <div key={l} className={`${card} text-center`}><div className="text-[26px] font-extrabold text-[#0b4bbf]">{n}</div><div className="text-[13.5px] leading-tight text-[#5f6f8a]">{l}</div></div>)}</div>
            <Btn onClick={() => setTab("jornadas")} className="shrink-0">Ver historial de jornadas</Btn></>)}
          {tab === "jornadas" && (<>{back("Jornadas")}
            <div className={card}>{jornadas.length === 0 && <p className="py-3 text-center text-[15px] text-[#5f6f8a]">Todavía no hay viajes. Inicia uno desde la pantalla Chofer.</p>}
              {jornadas.map((j) => (<div key={j.k} className="border-t border-[#edf1f7] py-2 first:border-0"><div className="text-[16px] font-bold">{j.name} · Micro N° {j.micro}</div><div className="text-[13.5px] text-[#5f6f8a]">Ramal {RAMALES[j.ramal]} · {dirTxt(j.dir)} · {hm(j.start)}–{hm(j.end)} ({mins(j.start, j.end)} min)</div></div>))}</div>
            {jornadas.length > 0 && <Btn tone="ghost" className="shrink-0" onClick={() => setModal({ t: "clear" })}>Borrar historial</Btn>}</>)}
          {tab === "config" && (<>{back("Configuración")}
            <div className={card}>
              <Input label="Nombre de la cooperativa" value={draft} onChange={(e) => setDraft(e.target.value)} onBlur={() => setTc(true)} error={tc && draft.trim().length < 3 ? "Mínimo 3 caracteres" : ""} />
              <div className="mb-3 flex items-center justify-between"><span className="text-[16px] font-semibold">Notificaciones</span><Toggle on={cfg.notif} label="Notificaciones" onClick={() => { setCfg({ ...cfg, notif: !cfg.notif }); say("adm", cfg.notif ? "Notificaciones desactivadas" : "Notificaciones activadas"); }} /></div>
              <Btn className="w-full" onClick={saveCfg}>Guardar cambios</Btn>
            </div>
            <Btn tone="ghost" className="shrink-0 !text-[#c0332b]" onClick={() => setModal({ t: "reset" })}>Restablecer datos</Btn></>)}
        </div>
        <nav className="grid shrink-0 grid-cols-3 border-t border-[#e1e8f3] bg-white pb-2 pt-2 text-center text-[13.5px] font-semibold text-[#5f6f8a]">
          {nav("inicio", "Inicio", Ic.home, ["inicio", "vehiculos", "jornadas"])}{nav("reportes", "Reportes", Ic.bars, ["reportes"])}{nav("config", "Configuración", Ic.gear, ["config"])}
        </nav>
      </div>
    </Phone>
  );
};

function App() {
  const [drivers, setDrivers] = useStored("tt_drivers", SEED);
  const [trip, setTrip] = useStored("tt_trip", null);
  const [jornadas, setJornadas] = useStored("tt_jornadas", []);
  const [profile, setProfile] = useStored("tt_profile", { name: "", phone: "" });
  const [cfg, setCfg] = useStored("tt_cfg", CFG0);
  const [view, setView] = useStored("tt_view", "pas");
  const [auth, setAuth] = useStored("tt_auth", {});
  const [toast, setToast] = useState(null);
  const now = useNow();
  const say = (phone, msg, tone = "ok") => setToast({ phone, msg, tone, k: Date.now() });
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 3000); return () => clearTimeout(id); }, [toast]);
  const resetAll = () => { setDrivers(SEED); setTrip(null); setJornadas([]); setProfile({ name: "", phone: "" }); setCfg(CFG0); setAuth({}); };
  const logout = () => { setAuth({}); setView("pas"); say("pas", "Sesión cerrada"); };
  const tf = (p) => (toast && toast.phone === p ? toast : null);
  const roles = [["pas", "Pasajero"], ["chof", "Chofer"], ["adm", "Administrador"]];
  const show = (k) => (view === k ? "" : "hidden");
  return (
    <main className="flex min-h-screen flex-col items-center justify-center gap-3 bg-[#e3e9f3] px-2 py-3 font-['Nunito_Sans',system-ui,sans-serif]">
      <div role="tablist" aria-label="Cambiar de vista" className="flex rounded-full bg-white/80 p-1 shadow-sm">
        {roles.map(([k, t]) => <button key={k} type="button" role="tab" aria-selected={view === k} onClick={() => setView(k)} className={`rounded-full px-4 py-1.5 text-[14px] font-bold ${view === k ? "bg-[#0b4bbf] text-white" : "text-[#5f6f8a]"}`}>{t}</button>)}
      </div>
      <Fit>
        <div className={show("pas")}><Pasajero drivers={drivers} trip={trip} now={now} profile={profile} setProfile={setProfile} auth={auth} setAuth={setAuth} view={view} go={setView} toast={tf("pas")} say={say} /></div>
        <div className={show("chof")}><Chofer drivers={drivers} meId={1} trip={trip} now={now} setTrip={setTrip} setJornadas={setJornadas} onLogout={logout} toast={tf("chof")} say={say} /></div>
        <div className={show("adm")}><Admin drivers={drivers} setDrivers={setDrivers} trip={trip} jornadas={jornadas} setJornadas={setJornadas} cfg={cfg} setCfg={setCfg} resetAll={resetAll} onLogout={logout} toast={tf("adm")} say={say} /></div>
      </Fit>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
